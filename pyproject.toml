[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrp"
version = "1.0.0"
description = "Volatility risk premium: forecasting, trading and risk on SPY"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "arch>=7.0",
  "matplotlib>=3.8",
  "pyarrow>=15",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
lstm = ["torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
